[project]
name = "close-ready"
version = "0.1.0"
description = "Month-end close data platform: double-entry ledger, three-way reconciliation and revenue recognition from Stripe data."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "stripe>=15.6.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
